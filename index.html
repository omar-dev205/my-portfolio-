    // Automation Flow Component
    function AutomationFlow() {
      const [activeEdge, setActiveEdge] = useState(0);
      const [hoveredNode, setHoveredNode] = useState(null);
      useEffect(() => { const t = setInterval(() => setActiveEdge(e => (e + 1) % FLOW_EDGES.length), 650); return () => clearInterval(t); }, []);

      const nodePos = {};
      FLOW_NODES.forEach(n => { nodePos[n.id] = { cx: PAD + n.col * (CELL + GAP) + CELL / 2, cy: PAD + n.row * (CELL + GAP) + CELL / 2 }; });
      const W = PAD * 2 + 3 * CELL + 2 * GAP, H = PAD * 2 + 3 * CELL + 2 * GAP;
      return (
        <div style={{ width: "100%", maxWidth: 400, display: "flex", flexDirection: "column", alignItems: "flex-end" }}>
          <p style={{ fontSize: 11, fontWeight: 700, letterSpacing: "0.12em", color: "#a78bfa", marginBottom: 12, textAlign: "right", textTransform: "uppercase" }}>I AUTOMATE WORKFLOWS WITH</p>
          <div style={{ position: "relative", width: W, height: H }}>
            <svg style={{ position: "absolute", inset: 0, pointerEvents: "none" }} width={W} height={H}>

                <marker id="arrowActive" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L0,7 L7,3.5 z" fill="#c084fc" /></marker>
              </defs>
              {FLOW_EDGES.map((edge, i) => {
                const from = nodePos[edge.from], to = nodePos[edge.to];
                if (!from || !to) return null;
                const active = i === activeEdge;
                const HALF = CELL / 2 - 4;
                const dx = to.cx - from.cx, dy = to.cy - from.cy;
                const len = Math.hypot(dx, dy);
                const ux = dx / len, uy = dy / len;
                const x1 = from.cx + ux * (HALF + 4), y1 = from.cy + uy * (HALF + 4);
                const x2 = to.cx - ux * (HALF + 12), y2 = to.cy - uy * (HALF + 12);
                return <line key={i} x1={x1} y1={y1} x2={x2} y2={y2} stroke={active ? "#c084fc" : "#3b1a6e"} strokeWidth={active ? 2 : 1.5} strokeDasharray={active ? "8 4" : "5 5"} className={active ? "flow-edge-active" : "flow-edge-inactive"} markerEnd={active ? "url(#arrowActive)" : "url(#arrowPurple)"} opacity={active ? 1 : 0.55} />;
              })}
            </svg>
            {FLOW_NODES.map(node => {
              const pos = nodePos[node.id];
              const isHovered = hoveredNode === node.id;
              return (
                <div key={node.id} className="flow-node" onMouseEnter={() => setHoveredNode(node.id)} onMouseLeave={() => setHoveredNode(null)} style={{ position: "absolute", left: pos.cx - CELL / 2, top: pos.cy - CELL / 2, width: CELL, height: CELL, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", cursor: "pointer", "--node-color": "#a855f7" }}>
                  <div className="flow-node-inner" style={{ width: 72, height: 72, borderRadius: 16, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", gap: 4, background: isHovered ? "rgba(139,92,246,0.12)" : "rgba(14,8,35,0.85)", border: `1.5px solid ${isHovered ? "#7c3aed" : "rgba(80,40,140,0.5)"}`, boxShadow: isHovered ? "0 0 20px rgba(139,92,246,0.35)" : "0 2px 12px rgba(0,0,0,0.4)" }}>
                    <BrandIcon name={node.iconKey} size={28} />
                    <span style={{ fontSize: 8.5, color: isHovered ? "#d8b4fe" : "#9ca3af", fontWeight: 600, textAlign: "center", lineHeight: 1.2, maxWidth: 64 }}>{node.label}</span>
